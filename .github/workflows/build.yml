name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布标签（如 v1.0.23），留空则仅构建不发版'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.3

      - name: Generate icon
        run: python generate_icon.py

      - name: Build main program
        run: python run_pyi.py --clean RaccoonQuant.spec

      - name: Build uninstaller
        run: python run_pyi.py --clean uninstaller.spec

      - name: Build installer
        run: python run_pyi.py --clean installer.spec

      - name: Package distribution
        run: Compress-Archive -Path dist\* -DestinationPath RaccoonQuant-dist.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RaccoonQuant-dist
          path: RaccoonQuant-dist.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: RaccoonQuant-dist.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
